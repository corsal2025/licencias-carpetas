<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="Raúl Salazar">
<title>Arquitectura SGL</title>
<style>
:root{--bg:#f7f8fa;--card:#fff;--fg:#1c2330;--mut:#5b6575;--acc:#1d5fd1;--bd:#dde2ea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151c;--card:#1a2029;--fg:#e6e9ee;--mut:#9aa4b2;--acc:#6ea0ff;--bd:#2b3340}}
:root[data-theme="dark"]{--bg:#11151c;--card:#1a2029;--fg:#e6e9ee;--mut:#9aa4b2;--acc:#6ea0ff;--bd:#2b3340}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,Segoe UI,sans-serif}
header,main,footer{max-width:1100px;margin:auto;padding:16px}
h1{margin:0;font-size:22px}.sub{color:var(--mut)}
nav{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
nav button{border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:6px 12px;border-radius:6px;cursor:pointer}
nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:16px;overflow-x:auto}
.desc{color:var(--mut);margin:0 0 12px}
#info{margin-top:12px;min-height:3em}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--bd);padding:6px;text-align:left;vertical-align:top}
footer{color:var(--mut);font-size:13px;border-top:1px solid var(--bd)}
</style>
</head>
<body>
<header>
  <h1>Sistema de Gestión de Licencias de Conducir</h1>
  <div class="sub">Diagrama vivo de arquitectura · Creado por <b>Raúl Salazar</b> · <span id="ver"></span></div>
</header>
<main>
  <nav id="tabs"></nav>
  <div class="card">
    <p class="desc" id="d"></p>
    <div id="diag"></div>
    <div id="info" class="sub">Haz clic en un componente para ver su detalle.</div>
  </div>
  <h2>Historial de cambios</h2>
  <div class="card"><table id="log"><tr><th>Versión</th><th>Fecha</th><th>Cambio</th></tr></table></div>
</main>
<footer>Desarrollado por Raúl Salazar</footer>

<script src="vendor/mermaid.min.js"></script>
<script>
/* =====================================================================
   PARA ACTUALIZAR: editar solo este bloque DATA y agregar entrada en CHANGELOG.
   Regla SDD (openspec/config.yaml → rules.proposal): todo cambio que altere
   arquitectura, módulos, modelo o despliegue MUST actualizar este archivo.
   ===================================================================== */
const VERSION = "v0.4.0";
const CHANGELOG = [
  ["v0.1.0","2026-09-25","Arquitectura inicial (borrador fuera del repo, stack planificado pero no real: Blazor, Clean Architecture, SQL Server, EF Core, 3 sedes)."],
  ["v0.2.0","2026-09-25","Diagrama traído al repo (docs/arquitectura.html) y corregido con el stack real: .NET 10 Razor Pages, SQLite con repositorios de SQL crudo, ClosedXML para Excel, módulos Gestión de Licencias / F8 Urgentes / Cambio de Domicilio (EWS contra Exchange on-prem), roles y auditoría (CaseAuditEntry), estadísticas y respaldos. Enums reales tomados de Domain/. mermaid.min.js vendorizado en docs/vendor/ (sin CDN)."],
  ["v0.3.0","2026-09-26","sgl-ficha-persona: página /Persona (solo lectura, PRG + TempData, el RUT nunca en la URL) con PersonFileQuery que consolida casos de todas las sedes, historial de auditoría, F8, Cambio de Domicilio y Certificados por RUT canónico. OfficeScope como punto de enchufe para roles por sede. Búsqueda global corregida (columnas reales de Cambio de Domicilio) y ampliada a Certificados."],
  ["v0.4.0","2026-09-26","sgl-kpi-dashboard-comparativo: /Estadisticas/Comparativo con SedeKpiService (decisiones, estados, tiempo citación→decisión desde la auditoría con N y % sin fecha, backlog por antigüedad, tendencia mensual) y export Excel de 3 hojas. OfficeScope pasa a Domain y es compartido por ficha, KPI y roles."]
];
const INFO = {
  U:"Funcionarios (roles Administrador, Jefatura, Coordinador y operador) autenticados por cookie. Un solo equipo local por ahora.",
  WEB:"Interfaz web: ASP.NET Core Razor Pages (.NET 10). Sin SPA ni framework de UI adicional.",
  AUTH:"Autenticación por cookie con hash PBKDF2. Autorización por roles y por claims de módulo (mod:f8-urgentes, mod:cambio-domicilio).",
  GL:"Módulo Gestión de Licencias: pantalla Casos, filtros por oficina/año/mes/estado/decisión/sector, exportación a Excel.",
  F8:"Módulo F8 Urgentes: mismo login y misma carpetas.db (tabla UrgentRequest propia), detrás de la política F8Access.",
  CD:"Módulo Cambio de Domicilio: sincroniza contra Exchange Web Services (EWS) on-prem al apretar \"Sincronizar ahora\" (sin polling), detrás de la política CambioDomicilioAccess.",
  REPO:"Repositorios de SQL crudo (Microsoft.Data.Sqlite): sin ORM. Único lugar que conoce el esquema de la base.",
  DOM:"Dominio: entidades y enums (FolderState, FinalDecision, FolderSector, Office, LicenceClass). Reglas de negocio puras.",
  DB:"SQLite (archivo local, carpetas.db). Hoy en el PC del Depto.; migrará a un servidor municipal sin cambiar el código.",
  AUD:"Auditoría: CaseAuditEntry registra quién cambió qué campo y cuándo. Trazabilidad exigida por el proceso.",
  IMP:"Importador Excel (ClosedXML): migra el libro histórico normalizando variantes de escritura (ESPERA EXÁMEN/EXAMEN, espacios, tildes).",
  EWS:"Exchange Web Services: buzón institucional cambiodedomicilio@munivalpo.cl, sin polling automático.",
  KPI:"Comparativo por sede (/Estadisticas/Comparativo): SedeKpiService calcula por sede y periodo; los gráficos son HTML/CSS del servidor (sin CDN). Exporta a Excel.",
  EST:"Estadísticas: agendadas, atendidas y % de atención calculados; escaneadas/subidas siguen siendo contadores manuales.",
  FICHA:"Ficha de persona (/Persona): consulta de solo lectura por RUT sobre todos los módulos. PersonFileQuery compara el RUT en forma canónica (sin puntos, guion ni ceros a la izquierda). Recibe un OfficeScope (sedes permitidas).",
  BAK:"Respaldos: DatabaseBackup copia carpetas.db a una carpeta backups/ junto al ejecutable en cada arranque."
};
const VIEWS = {
  "Arquitectura": {d:"Capas de la aplicación. Razor Pages habla directo con los repositorios SQL; no hay capa de aplicación ni ORM intermedios.", g:`
flowchart TB
  U([Funcionarios]) --> AUTH[Autenticación y roles]
  AUTH --> WEB[Razor Pages .NET 10]
  WEB --> GL[Gestión de Licencias]
  WEB --> F8[F8 Urgentes]
  WEB --> CD[Cambio de Domicilio]
  CD --> EWS[Exchange EWS]
  WEB --> REPO[Repositorios SQL crudo]
  REPO --> DOM[Dominio]
  REPO --> DB[(SQLite)]
  WEB --> AUD[Auditoría]
  AUD --> DB
  DB --> BAK[Respaldos locales]
  IMP[Importador Excel] --> REPO
  WEB --> EST[Estadísticas]
  EST --> KPI[Comparativo por sede]
  KPI --> REPO
  WEB --> FICHA[Ficha de persona]
  FICHA --> REPO`},
  "Flujo de carpeta": {d:"Ciclo de vida de una carpeta (FolderState → FinalDecision), desde citación hasta decisión final.", g:`
stateDiagram-v2
  [*] --> PrimeraLicencia
  PrimeraLicencia --> SubidaAConaset
  SubidaAConaset --> EsperaExamen: F8 u Oficio
  PrimeraLicencia --> CambioDomicilioSolicitado
  CambioDomicilioSolicitado --> CambioDomicilioSubidoAConaset
  EsperaExamen --> ClasePendiente
  EsperaExamen --> Otorgado
  EsperaExamen --> ParaDenegar
  ParaDenegar --> Denegado
  Otorgado --> [*]
  Denegado --> [*]`},
  "Modelo de datos": {d:"Entidades principales en SQLite. Enums reales del Dominio, guardados como ordinal (no reordenar).", g:`
erDiagram
  CARPETA ||--o{ HISTORIAL : registra
  CARPETA {
    string FolderState "16 valores, 5 retirados de la selección"
    string FinalDecision "9 valores"
    string FolderSector "Archivo u Oficina43, derivado"
    string Office "Av. Argentina, Placilla, Merc. Puerto"
    string LicenceClass "A1-A5, B, C, D, E, F"
  }
  HISTORIAL {
    datetime Fecha
    string Campo
    string Anterior
    string Nuevo
    string Usuario
  }`},
  "Despliegue": {d:"Hoy un ejecutable local generado con deploy/publish.ps1; más adelante, un servidor municipal.", g:`
flowchart LR
  subgraph Hoy
    PC[PC local Depto. Licencias] --> SQLL[(SQLite local)]
    PC --> PS1[deploy/publish.ps1]
  end
  subgraph Futuro
    SRV[Servidor municipal] --> SQLS[(SQLite / servidor)]
  end
  Hoy -. migración .-> Futuro`}
};
/* ===================================================================== */

mermaid.initialize({startOnLoad:false,securityLevel:"loose",
  theme:matchMedia("(prefers-color-scheme: dark)").matches?"dark":"default"});
window.show = id => document.getElementById("info").innerHTML = "<b>"+id+":</b> "+(INFO[id]||"");
document.getElementById("ver").textContent = VERSION;
const log = document.getElementById("log");
CHANGELOG.slice().reverse().forEach(r=>{const tr=log.insertRow();r.forEach(c=>tr.insertCell().textContent=c)});
const tabs = document.getElementById("tabs");
async function render(name){
  [...tabs.children].forEach(b=>b.classList.toggle("on",b.textContent===name));
  const v = VIEWS[name]; document.getElementById("d").textContent = v.d;
  let g = v.g;
  if (g.trim().startsWith("flowchart")) g += "\n" + Object.keys(INFO).filter(k=>new RegExp("\\b"+k+"[\\[\\(/]").test(g)).map(k=>`  click ${k} call show("${k}")`).join("\n");
  const {svg,bindFunctions} = await mermaid.render("m"+Date.now(), g);
  const el = document.getElementById("diag"); el.innerHTML = svg; bindFunctions && bindFunctions(el);
}
Object.keys(VIEWS).forEach(n=>{const b=document.createElement("button");b.textContent=n;b.onclick=()=>render(n);tabs.appendChild(b)});
render("Arquitectura");
</script>
</body>
</html>
